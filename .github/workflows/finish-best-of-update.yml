name: finish-best-of-update

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Reviewed pull request number"
        required: true
        type: string
      expected_head_sha:
        description: "Exact reviewed PR head SHA"
        required: true
        type: string
      version:
        description: "Update version/tag, for example 2026.07.23"
        required: true
        type: string
      update_branch:
        description: "Reviewed update branch, for example update/2026.07.23"
        required: true
        type: string
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 21 * * 4" # Three hours after update-best-of-list at 18:00 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: finish-best-of-update-${{ github.event.issue.number || inputs.version || github.event_name }}
  cancel-in-progress: false

jobs:
  verify-and-finish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/finish-best-of-update '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: main

    steps:
      - name: Resolve and authorize request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_UPDATE_BRANCH: ${{ inputs.update_branch }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$DISPATCH_PR_NUMBER"
            expected_head_sha="$DISPATCH_EXPECTED_HEAD_SHA"
            version="$DISPATCH_VERSION"
            update_branch="$DISPATCH_UPDATE_BRANCH"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            today="$(date -u '+%Y.%m.%d')"
            title_prefix="Best-of update: $today"
            open_prs="$(gh pr list \
              --repo "$REPO" \
              --base "$DEFAULT_BRANCH" \
              --state open \
              --json number,title,headRefName,headRefOid,isDraft \
              --limit 100)"

            candidates="$(jq -c --arg title_prefix "$title_prefix" '
              [
                .[]
                | select(.isDraft == false)
                | select(.title | test("^Best-of update: [0-9]{4}\\.[0-9]{2}\\.[0-9]{2}(-[0-9]{2}\\.[0-9]{2})?$"))
                | select(.title == $title_prefix or (.title | startswith($title_prefix + "-")))
                | . + {version: (.title | sub("^Best-of update: "; ""))}
                | select(.headRefName == ("update/" + .version))
              ]
            ' <<<"$open_prs")"
            candidate_count="$(jq 'length' <<<"$candidates")"

            if [[ "$candidate_count" == "0" ]]; then
              echo "No current open update PR found for $today"
              echo "SKIP_FINISH=true" >> "$GITHUB_ENV"
              exit 0
            fi
            [[ "$candidate_count" == "1" ]] || {
              echo "Expected at most one current open update PR, found $candidate_count" >&2
              jq -r '.[] | "#\(.number) \(.title) \(.headRefName)"' <<<"$candidates" >&2
              exit 1
            }

            candidate="$(jq -c '.[0]' <<<"$candidates")"
            pr_number="$(jq -r '.number' <<<"$candidate")"
            expected_head_sha="$(jq -r '.headRefOid' <<<"$candidate")"
            version="$(jq -r '.version' <<<"$candidate")"
            update_branch="$(jq -r '.headRefName' <<<"$candidate")"
          else
            [[ "$AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]] || {
              echo "Comment author association is not trusted: $AUTHOR_ASSOCIATION" >&2
              exit 1
            }

            permission="$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission')"
            [[ "$permission" =~ ^(admin|maintain|write)$ ]] || {
              echo "Commenter lacks write permission: $COMMENTER ($permission)" >&2
              exit 1
            }

            read -r command expected_head_sha extra <<<"$COMMENT_BODY"
            [[ "$command" == "/finish-best-of-update" && -z "${extra:-}" ]] || {
              echo "Expected exact command: /finish-best-of-update <40-character-sha>" >&2
              exit 1
            }

            pr_number="$COMMENT_PR_NUMBER"
            pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
            title="$(jq -r '.title' <<<"$pr_json")"
            update_branch="$(jq -r '.head.ref' <<<"$pr_json")"

            [[ "$title" =~ ^Best-of\ update:\ (.+)$ ]] || {
              echo "Unexpected PR title: $title" >&2
              exit 1
            }
            version="${BASH_REMATCH[1]}"
          fi

          [[ "$pr_number" =~ ^[0-9]+$ ]] || {
            echo "PR number must be numeric" >&2
            exit 1
          }
          [[ "$expected_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Expected head SHA must be a full 40-character commit SHA" >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.-][0-9]{2}\.[0-9]{2})?$ ]] || {
            echo "Version has an unexpected format: $version" >&2
            exit 1
          }
          [[ "$update_branch" == "update/$version" ]] || {
            echo "Update branch must exactly equal update/$version" >&2
            exit 1
          }
          [[ "$update_branch" != "$DEFAULT_BRANCH" ]] || {
            echo "Refusing to operate on the default branch" >&2
            exit 1
          }

          {
            echo "PR_NUMBER=$pr_number"
            echo "EXPECTED_HEAD_SHA=$expected_head_sha"
            echo "VERSION=$version"
            echo "UPDATE_BRANCH=$update_branch"
          } >> "$GITHUB_ENV"

      - name: Checkout reviewed repository
        if: ${{ env.SKIP_FINISH != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout trusted workflow repository
        if: ${{ env.SKIP_FINISH != 'true' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: trusted

      - name: Checkout reviewed update commit
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          git checkout --detach "$EXPECTED_HEAD_SHA"

      - name: Validate generated weekly update
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          python trusted/scripts/validate_generated_update.py \
            --base-ref "origin/$DEFAULT_BRANCH" \
            --allow-upstream-eof-blank-line

      - name: Set up validation Python
        if: ${{ env.SKIP_FINISH != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        if: ${{ env.SKIP_FINISH != 'true' }}
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run repository validation
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s trusted/tests -v
          python trusted/scripts/validate_metadata.py

      - name: Verify reviewed pull request state
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          title="$(jq -r '.title' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          merged="$(jq -r '.merged' <<<"$pr_json")"

          [[ "$state" == "open" && "$merged" == "false" && "$draft" == "false" ]]
          [[ "$title" == "Best-of update: $VERSION" ]]
          [[ "$base_ref" == "$DEFAULT_BRANCH" ]]
          [[ "$head_ref" == "$UPDATE_BRANCH" ]]
          [[ "$head_repo" == "$REPO" ]]
          [[ "$head_sha" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "PR head SHA changed after review" >&2
            exit 1
          }

          branch_sha="$(gh api "repos/$REPO/git/ref/heads/$UPDATE_BRANCH" --jq '.object.sha')"
          [[ "$branch_sha" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "Update branch no longer points to the reviewed SHA" >&2
            exit 1
          }

      - name: Verify matching draft release exists
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          releases="$(gh api --paginate "repos/$REPO/releases?per_page=100")"
          release_count="$(jq --arg tag "$VERSION" '[.[] | select(.tag_name == $tag)] | length' <<<"$releases")"
          [[ "$release_count" == "1" ]] || {
            echo "Expected exactly one release for tag $VERSION, found $release_count" >&2
            exit 1
          }

          is_draft="$(jq -r --arg tag "$VERSION" '.[] | select(.tag_name == $tag) | .draft' <<<"$releases")"
          is_prerelease="$(jq -r --arg tag "$VERSION" '.[] | select(.tag_name == $tag) | .prerelease' <<<"$releases")"
          [[ "$is_draft" == "true" && "$is_prerelease" == "false" ]]

      - name: Merge reviewed pull request
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --match-head-commit "$EXPECTED_HEAD_SHA"

      - name: Verify merge completed
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')" == "true" ]]

      - name: Publish matching draft release as latest
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$VERSION\") | .id")"
          [[ -n "$release_id" ]]
          gh api --method PATCH "repos/$REPO/releases/$release_id" \
            -F draft=false -F prerelease=false -F make_latest=true >/dev/null

      - name: Verify release publication
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/$REPO/releases/tags/$VERSION")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]]
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == "false" ]]
          [[ "$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')" == "$VERSION" ]]

      - name: Delete reviewed update branch
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          branch_sha="$(gh api "repos/$REPO/git/ref/heads/$UPDATE_BRANCH" --jq '.object.sha')"
          [[ "$branch_sha" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "Refusing to delete branch because it moved after review" >&2
            exit 1
          }
          gh api --method DELETE "repos/$REPO/git/refs/heads/$UPDATE_BRANCH"

      - name: Verify final state
        if: ${{ env.SKIP_FINISH != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')" == "true" ]]
          [[ "$(gh api "repos/$REPO/releases/tags/$VERSION" --jq '.draft')" == "false" ]]

          if gh api "repos/$REPO/git/ref/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
            echo "Update branch still exists after deletion" >&2
            exit 1
          fi

          echo "Finished best-of update $VERSION"
          echo "Merged PR #$PR_NUMBER at reviewed head $EXPECTED_HEAD_SHA"
          echo "Published release $VERSION as latest"
          echo "Deleted branch $UPDATE_BRANCH"
