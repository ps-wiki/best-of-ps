# Based on https://github.com/best-of-lists/best-of-update-action/blob/v0.8.5/workflows/update-best-of-list.yml
name: update-best-of-list

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for this update"
        required: false
  schedule:
    - cron: "0 18 * * 4" # Every thursday at 6pm

env:
  BRANCH_PREFIX: "update/"
  DEFAULT_BRANCH: "main"

jobs:
  update-best-of-list:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event.inputs != null  &&  github.event.inputs.version != null }}
        name: set-version-from-input
        run: echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      - if: ${{ ! (env.VERSION != null && env.VERSION != '') }}
        name: set-version-via-date
        run: echo "VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV
      - uses: actions/checkout@v6
      - name: check-version-tag
        shell: bash
        run: |
          git fetch --tags --force
          git show-ref --tags --verify --quiet -- "refs/tags/${{ env.VERSION }}" && echo "VERSION=$(date '+%Y.%m.%d-%H.%M')" >> $GITHUB_ENV || exit 0
      - name: create-update-branch
        uses: peterjgrainger/action-create-branch@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          branch: "${{ env.BRANCH_PREFIX }}${{ env.VERSION }}"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_PREFIX }}${{ env.VERSION }}
          token: ${{ secrets.PAT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: set-up-metadata-collection
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: install-metadata-dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: test-score-extension
        run: python -m unittest discover -s tests -v
      - name: validate-curated-metadata
        run: python scripts/validate_metadata.py
      - name: collect-julia-package-metrics
        run: |
          python scripts/collect_julia_metrics.py \
            --output metadata/generated/julia_metrics.json
      - name: collect-paper-citation-metrics
        run: |
          python scripts/collect_citation_metrics.py \
            --output metadata/generated/citation_metrics.json
      - name: validate-collected-metrics
        run: python scripts/validate_collected_metrics.py
      - name: update-best-of-list
        uses: best-of-lists/best-of-update-action@v0.8.5
        with:
          libraries_key: ${{ secrets.LIBRARIES_KEY }}
          github_key: ${{ secrets.PAT_TOKEN }}
      - name: validate-applied-score-adjustments
        run: python scripts/validate_applied_scores.py
      - name: soften generated dead-project wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              '- 💀&nbsp; Dead project _(24 months no activity)_',
              '- 🧊&nbsp; Long-inactive project _(24 months no visible activity)_'
          )
          text = text.replace('💀', '🧊')
          text = text.replace('Dead project', 'Long-inactive project')
          path.write_text(text)
          PY
      - name: push-update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ env.BRANCH_PREFIX }}${{ env.VERSION  }}
          commit_user_name: best-of update
          commit_user_email: actions@github.com
          commit_message: Update best-of list for version ${{ env.VERSION  }}
          tagging_message: ${{ env.VERSION  }}
          skip_dirty_check: true
          commit_options: "--allow-empty"
      - name: create-pull-request
        shell: bash
        run: |
          # Stops script execution if a command has an error
          set -e
          curl -fsSL https://github.com/github/hub/raw/master/script/get | bash -s 2.14.2
          bin/hub pull-request -b ${{ env.DEFAULT_BRANCH }} -h ${{ env.BRANCH_PREFIX }}${{ env.VERSION  }} --no-edit -m "Best-of update: ${{ env.VERSION  }}" -m "To finish this update: Select <code>Merge pull request</code> below and <code>Confirm merge</code>. Also, make sure to publish the created draft release in the [releases section](../releases) as well." || true
          rm bin/hub
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: create-release
        shell: bash
        run: |
          gh release create "${VERSION}" \
            --draft \
            --title "Update: ${VERSION}" \
            --notes-file latest-changes.md
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: record-finish-metadata
        shell: bash
        run: |
          set -euo pipefail

          update_branch="${BRANCH_PREFIX}${VERSION}"
          head_sha="$(git rev-parse HEAD)"
          pull_requests="$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "${DEFAULT_BRANCH}" \
            --head "${update_branch}" \
            --state open \
            --json number,headRefName \
            --limit 20)"
          pr_number="$(jq -r --arg branch "$update_branch" \
            'map(select(.headRefName == $branch)) | if length == 1 then .[0].number else empty end' \
            <<<"$pull_requests")"

          [[ -n "$pr_number" ]] || {
            echo "Expected exactly one open update PR for $update_branch" >&2
            echo "$pull_requests" >&2
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/best-of-update"
          jq -n \
            --arg pr_number "$pr_number" \
            --arg expected_head_sha "$head_sha" \
            --arg version "$VERSION" \
            --arg update_branch "$update_branch" \
            '{pr_number: ($pr_number | tonumber), expected_head_sha: $expected_head_sha, version: $version, update_branch: $update_branch}' \
            > "$RUNNER_TEMP/best-of-update/finish-metadata.json"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: upload-finish-metadata
        uses: actions/upload-artifact@v4
        with:
          name: best-of-update-finish
          path: ${{ runner.temp }}/best-of-update/finish-metadata.json
          if-no-files-found: error
          retention-days: 14
